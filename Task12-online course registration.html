
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Course Registration</title>
    
    
</head>
<body>

<div class="container">
    <h2>Online Course Registration Form</h2>
    
   
    <form action="/submit" method="post" target="_self">

        <label for="sname">Student Name:</label>
        <input type="text" id="sname" name="student_name" placeholder="Enter full name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="10 digit number" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="10" max="60" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        
        <label>Gender:</label>
        <div class="radio-group">
            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
        </div>

        
        <label>Skills:</label>
        <div class="checkbox-group">
            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label>

            <input type="checkbox" id="js" name="skills" value="JavaScript">
            <label for="js">JavaScript</label>

            <input type="checkbox" id="python" name="skills" value="Python">
            <label for="python">Python</label>
        </div>

        
        <label for="course">Select Course:</label>
        <select id="course" name="course" required>
            <option value="">--Choose Course--</option>
            <option value="webdev">Web Development</option>
            <option value="python">Python Programming</option>
            <option value="java">Java</option>
            <option value="data">Data Science</option>
        </select>

        <label for="doc">Upload Supporting Document:</label>
        <input type="file" id="doc" name="document">

        <label for="details">Additional Details:</label>
        <textarea id="details" name="details" rows="4" placeholder="Any message..."></textarea>

        <div class="btn">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>

    </form>
</div>

</body>
</html>
